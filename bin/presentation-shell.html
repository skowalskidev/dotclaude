<!doctype html>
<html lang="en" data-theme="auto"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; frame-src about: data: blob:; connect-src 'none'; media-src data: blob:; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title>
<style>
:root{--canvas:#f2f3f5;--surface:#fff;--surface-2:#f7f7f8;--line:#e2e4e8;--ink:#17191e;--ink-2:#5e636d;--ink-3:#8b909a;--accent:#2f5bea;--accent-soft:#eaf0ff;--warn:#9a6700;--warn-soft:#fff4d6;--ok:#1e7a34;--shadow-frame:0 1px 2px #0000000f,0 8px 24px #00000014;--inspector-w:320px;color-scheme:light}
:root[data-theme=dark]{--canvas:#121316;--surface:#1b1d22;--surface-2:#22252b;--line:#2e3138;--ink:#eceef1;--ink-2:#9aa0ab;--ink-3:#6e7480;--accent:#7c9bff;--accent-soft:#1f2a4d;--warn:#e5b454;--warn-soft:#3a2e12;--ok:#6ccb84;--shadow-frame:0 0 0 1px #ffffff14,0 8px 24px #00000080;color-scheme:dark}
@media(prefers-color-scheme:dark){:root[data-theme=auto]{--canvas:#121316;--surface:#1b1d22;--surface-2:#22252b;--line:#2e3138;--ink:#eceef1;--ink-2:#9aa0ab;--ink-3:#6e7480;--accent:#7c9bff;--accent-soft:#1f2a4d;--warn:#e5b454;--warn-soft:#3a2e12;--ok:#6ccb84;--shadow-frame:0 0 0 1px #ffffff14,0 8px 24px #00000080;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased}button,select{font:inherit;color:inherit}button,select{border:1px solid var(--line);border-radius:6px;background:var(--surface)}button{min-height:32px;padding:6px 10px;cursor:pointer}button:hover{background:var(--surface-2)}button:disabled{opacity:.45;cursor:default}button.active,button[aria-checked=true]{background:var(--accent-soft);color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}select{max-width:100%;padding:7px}h1,h2,h3,p{margin:0}button,summary{overflow-wrap:anywhere}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.skip{position:fixed;left:8px;top:-60px;z-index:100}.skip:focus{top:8px;background:var(--surface);padding:8px}
#presentation-app{display:grid;grid-template-columns:minmax(0,1fr) var(--inspector-w);height:100%;overflow:hidden}#presentation-app.is-collapsed{grid-template-columns:minmax(0,1fr) 0}#mock-stage{position:relative;min-width:0;min-height:0;padding:24px;overflow:auto;background:var(--canvas)}#mock-rail{position:relative;min-width:0;overflow:hidden auto;border-left:1px solid var(--line);background:var(--surface)}#mock-rail>*{min-width:0;max-width:100%}.rail-heading{display:flex;align-items:flex-start;gap:8px;padding:16px 12px}.rail-heading h1{flex:1;min-width:0;font-size:14px;line-height:20px;font-weight:600;overflow-wrap:anywhere}.rail-heading small{display:block;color:var(--ink-2);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}#mock-rail-body{padding:0 12px 16px}.control-section{margin-bottom:16px;min-width:0}.control-section h2{font-size:11px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:16px 4px 8px;font-weight:600}.control-section button.row{display:block;width:100%;text-align:left;border:0;min-height:36px;margin:2px 0}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{font-size:12px;max-width:100%}.segments{display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--surface-2)}.segments button{flex:1;border:0;background:transparent;font-size:13px}.segments button.active{background:var(--surface);box-shadow:0 1px 2px #00000014;color:var(--ink);font-weight:600;border-bottom:2px solid var(--accent)}.switch-row{display:flex;width:100%;align-items:center;justify-content:space-between;border:0;text-align:left;font-size:13px;gap:8px}.switch-track{flex-shrink:0;width:36px;height:20px;border-radius:20px;background:var(--line);padding:3px}.switch-track:after{content:"";display:block;width:14px;height:14px;background:var(--surface);border-radius:50%}[aria-checked=true] .switch-track{background:var(--accent)}[aria-checked=true] .switch-track:after{transform:translateX(16px)}details summary{cursor:pointer;font-size:13px;padding:8px 4px}.frame-tools{padding:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}.frame-tools label{width:100%;font-size:12px;color:var(--ink-2);display:flex;align-items:center;justify-content:space-between}.pane-tag{font-size:11px;line-height:16px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}.pane-tag.after{background:var(--accent-soft);color:var(--accent);border-color:transparent}.pane-tag.earlier{background:var(--warn-soft);color:var(--warn);border-color:transparent}.history-banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 12px;font-size:13px;margin-bottom:16px}.history-banner button{font-size:12px;background:var(--surface)}#open-controls{display:none;position:fixed;right:12px;top:12px;z-index:20;box-shadow:var(--shadow-frame);font-size:12px}#presentation-app.is-collapsed #open-controls{display:block}#controls-backdrop{display:none}iframe{color-scheme:light}
@media(max-width:1024px){:root{--inspector-w:288px}#mock-stage{padding:20px}}
@media(max-width:719px){#presentation-app{grid-template-columns:minmax(0,1fr)}#mock-stage{padding:52px 12px 12px}#mock-rail{position:fixed;z-index:30;left:0;right:0;bottom:0;height:min(70vh,620px);border:1px solid var(--line);border-radius:12px 12px 0 0;box-shadow:var(--shadow-frame)}#presentation-app.is-collapsed #mock-rail{display:none}#controls-backdrop{position:fixed;inset:0;background:#0004;z-index:25;border:0;border-radius:0;width:100%}#presentation-app:not(.is-collapsed) #controls-backdrop{display:block}}
@@ADAPTER_STYLE@@
</style></head><body>
<a class="skip" href="#mock-stage">Skip to preview</a>
<div id="presentation-app" data-kind="@@KIND@@">
<main id="mock-stage" tabindex="-1" aria-label="Preview">@@CONTENT@@</main>
<button id="controls-backdrop" aria-label="Close controls" tabindex="-1"></button>
<aside id="mock-rail" aria-label="Controls"><div class="rail-heading"><h1><small>@@KIND@@</small>@@TITLE@@</h1><button id="mock-rail-toggle-btn" aria-label="Close controls" aria-controls="mock-rail" aria-expanded="true">×</button></div><div id="mock-rail-body"></div><div class="frame-tools"><label>Theme<select id="frame-theme"><option value="auto">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label></div></aside>
<button id="open-controls" aria-controls="mock-rail" aria-expanded="false">Open controls</button><div id="frame-status" class="sr-only" aria-live="polite"></div>
</div>
<script id="spec" type="application/json">@@SPEC@@</script>
<script>
'use strict';
const SPEC=JSON.parse(document.getElementById('spec').textContent);
const Frame=(()=>{
 const app=document.getElementById('presentation-app'),stage=document.getElementById('mock-stage'),rail=document.getElementById('mock-rail-body'),toggle=document.getElementById('mock-rail-toggle-btn'),open=document.getElementById('open-controls'),theme=document.getElementById('frame-theme');
 const storage={get(k){try{return localStorage.getItem('presentation.'+k)}catch(_){return null}},set(k,v){try{localStorage.setItem('presentation.'+k,v)}catch(_){}}};
 let onResize=()=>{},onKey=()=>{},collapsed=false;
 function announce(text){document.getElementById('frame-status').textContent=text}
 function setCollapsed(value){collapsed=value;app.classList.toggle('is-collapsed',value);toggle.setAttribute('aria-expanded',String(!value));open.setAttribute('aria-expanded',String(!value));document.getElementById('mock-rail').inert=value;storage.set('inspector',value?'closed':'open');onResize();if(value)open.focus();else toggle.focus()}
 function setTheme(value){theme.value=['auto','light','dark'].includes(value)?value:'auto';document.documentElement.dataset.theme=theme.value;storage.set('theme',theme.value)}
 toggle.onclick=()=>setCollapsed(true);open.onclick=()=>setCollapsed(false);document.getElementById('controls-backdrop').onclick=()=>setCollapsed(true);theme.onchange=()=>setTheme(theme.value);
 setTheme(storage.get('theme')||'auto');collapsed=storage.get('inspector')==='closed'||matchMedia('(max-width:719px)').matches||!!SPEC.shell?.railCollapsed;app.classList.toggle('is-collapsed',collapsed);document.getElementById('mock-rail').inert=collapsed;toggle.setAttribute('aria-expanded',String(!collapsed));open.setAttribute('aria-expanded',String(!collapsed));
 addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable=true]')||e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toLowerCase();if(k==='i'){e.preventDefault();setCollapsed(!collapsed)}else if(k==='d'){setTheme(['auto','light','dark'][(['auto','light','dark'].indexOf(theme.value)+1)%3])}else if(k==='escape'&&!collapsed&&innerWidth<720)setCollapsed(true);else onKey(e)});
 let queued=false;function resize(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;onResize()})}addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
 // Captures own their overlays. Remove body-level escapes without touching the shared frame.
 new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1&&n.id!=='presentation-app'){console.warn('[presentation] removed capture overlay outside its frame');n.remove()}}))).observe(document.body,{childList:true});
 return {app,stage,rail,announce,setCollapsed,setTheme,configure(o){onResize=o.resize||onResize;onKey=o.key||onKey},escape(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}};
})();
@@ADAPTER_SCRIPT@@
</script></body></html>
