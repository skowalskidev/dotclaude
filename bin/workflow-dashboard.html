<script>
let spec=JSON.parse(document.querySelector('#spec').textContent), connected=false, failed=false, lastRevision=spec.revision;
function readRoute(){const p=new URLSearchParams(location.hash.replace(/^#/,''));return {section:p.get('section'),asset:p.get('asset'),modal:p.get('modal'),v:p.get('v'),variant:p.get('variant'),persona:p.get('persona'),state:p.get('state')}}

function writeRoute(section=selected,asset='',modal='',replace=false,mockupRoute=null){const p=new URLSearchParams();if(section)p.set('section',section);if(asset)p.set('asset',asset);if(modal)p.set('modal',modal);const route=cleanMockupRoute(mockupRoute);if(route){p.set('v',route.v);p.set('variant',route.variant);p.set('persona',route.persona);if(route.state)p.set('state',route.state)}const hash=p.toString(),url=hash?'#'+hash:location.pathname+location.search;if(url===location.hash||(!hash&&location.hash===''))return;(replace?history.replaceState:history.pushState).call(history,null,'',url)}
const initialRoute=readRoute();
let selected=spec.sections.some(s=>s.id===initialRoute.section)?initialRoute.section:spec.sections[0].id;
const $=id=>document.getElementById(id), el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const done=s=>s.status==='done', fraction=s=>Math.floor(100*s.criteria.filter(c=>c.passed).length/s.criteria.length);
const frameBindings=new Map();
function captureFrame(frame){frame.contentWindow?.postMessage({type:'dashboard-snapshot'},'*')}
const bridge=`<script data-dashboard-bridge>
function serialize(doc){const root=doc.documentElement.cloneNode(true);root.querySelectorAll('[data-dashboard-bridge],#dashboard-frame-policy').forEach(n=>n.remove());doc.querySelectorAll('input,textarea,select').forEach((n,i)=>{const c=root.querySelectorAll('input,textarea,select')[i];if(n.tagName==='TEXTAREA')c.textContent=n.value;else if(n.tagName==='SELECT')Array.from(c.options).forEach((o,j)=>o.toggleAttribute('selected',n.options[j].selected));else{c.setAttribute('value',n.value);c.toggleAttribute('checked',n.checked)}});doc.querySelectorAll('iframe').forEach((frame,i)=>{try{if(frame.contentDocument?.documentElement)root.querySelectorAll('iframe')[i].setAttribute('srcdoc',serialize(frame.contentDocument))}catch{}});return '<!doctype html>'+root.outerHTML}function snapshot(){parent.postMessage({type:'dashboard-feedback',html:serialize(document)},'*')}
const escapeDocs=new WeakSet();

 if(!doc||escapeDocs.has(doc))return;escapeDocs.add(doc);
 let innerOverlay=false;

}
wireEscapeDocument(document);

addEventListener('input',()=>setTimeout(snapshot,0));addEventListener('change',()=>setTimeout(snapshot,0));addEventListener('click',()=>setTimeout(snapshot,0));
<\/script>`;
function draftKey(sectionId,key,asset){return sectionId+':'+key+':'+asset.sha256}
function mountFrame(parent,a,sectionId,key,interactive){
 const frame=el('iframe'), initialMockupRoute=cleanMockupRoute(readRoute());frame.title=a.label;if(!interactive)frame.className='mock-preview';
 // A shell first reports its own default while srcdoc mounts. Replay the explicit dashboard
 // link afterwards so a direct tab always lands on the requested version, variant and state.
 frame.addEventListener('load',()=>{if(interactive&&initialMockupRoute)frame.contentWindow?.postMessage({type:'dashboard-mockup-route',route:initialMockupRoute},'*')});
 const policy='<meta id="dashboard-frame-policy" http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\'; style-src \'unsafe-inline\'; img-src data:; font-src data:; frame-src about:; connect-src \'none\'; form-action \'none\'">';
 frame.srcdoc=policy+a.html+bridge;parent.append(frame);frameBindings.set(frame,{asset:a,sectionId,key,revision:spec.revision});
 if(interactive){
  // The modal (only interactive caller) fills its bounded flex container at true 1:1 pixel
  // size — see the .mock-dialog CSS — instead of the panel thumbnails' CSS-scale-to-a-fixed-
  // design-viewport below. A transform-scaled iframe still reports its UNSCALED size as its
  // own innerHeight, so an embedded page doing its own "fit to my real viewport" math (the
  // mockup shell) was being lied to about how much room it had, and this dialog's own
  // overflow:hidden then clipped whatever spilled past the lie. No JS sizing needed here:
  // width/height:100% on a flex:1;min-height:0 child tracks the container on every resize.
  return frame;
 }
 const width=a.viewport?.width||1440,height=a.viewport?.height||900;
 const size=()=>{const scale=parent.clientWidth/width;frame.style.width=width+'px';frame.style.height=Math.max(height,parent.clientHeight/scale)+'px';frame.style.transform='scale('+scale+')'};
 new ResizeObserver(size).observe(parent);requestAnimationFrame(size);return frame;
}
// Live links use the canonical dashboard route. Offline exports open their embedded snapshot.
function closeDialog(dialog,navigate=true){if(!dialog)return;const finish=()=>{if(dialog.open)dialog.close();if(navigate)writeRoute(selected,'','')};if(dialog.id==='mock-dialog'){flushFrames().then(finish);return}finish()}
function openImage(a,sectionId,key,navigate=true){$('large-image').src=a.data;$('large-image').alt=a.label;if(navigate)writeRoute(sectionId,key,'image');$('image-dialog').showModal()}
function openRoutedModal(){const r=readRoute(),section=spec.sections.find(s=>s.id===selected),a=section?.[r.asset];if(r.modal==='run'){renderOptions();$('run-dialog').showModal();return}if(r.modal==='drafts'&&spec.feedbackDrafts&&Object.keys(spec.feedbackDrafts).length){$('drafts').click();return}if(!section||!a)return;if(r.modal==='mock'&&a.kind==='html')openMock(a,section.id,r.asset,false);if(r.modal==='image'&&a.kind==='image')openImage(a,section.id,r.asset,false)}
function assetTabUrl(sectionId,key,route=cleanMockupRoute(readRoute())){const url=new URL(location.href),params=new URLSearchParams({section:sectionId,asset:key,modal:'mock'});if(route){params.set('v',route.v);params.set('variant',route.variant);params.set('persona',route.persona);if(route.state)params.set('state',route.state)}url.hash=params.toString();return url.href}
function openAssetInTab(a,sectionId,key){if(location.protocol!=='file:')return window.open(assetTabUrl(sectionId,key),'_blank','noopener');const url=URL.createObjectURL(new Blob([a.html],{type:'text/html'}));const w=window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000);return w}
function openMock(a,sectionId,key,navigate=true){if(navigate)writeRoute(sectionId,key,'mock',false,cleanMockupRoute(readRoute()));$('mock-title').textContent=a.label;$('mock-stage').replaceChildren();const link=$('open-mock-tab');link.onclick=e=>{e.preventDefault();openAssetInTab(a,sectionId,key)};link.href=location.protocol==='file:'?'#':assetTabUrl(sectionId,key);$('mock-dialog').showModal();mountFrame($('mock-stage'),a,sectionId,key,true)}
addEventListener('message',e=>{if(e.data?.type==='dashboard-escape'){let trusted=false;for(const [frame] of frameBindings)if(frame.contentWindow===e.source){trusted=true;break}if(trusted){const dialog=document.querySelector('dialog[open]');if(dialog)closeDialog(dialog)}return}if(e.data?.type==='mockup:route'){const route=cleanMockupRoute(e.data.route);if(!route)return;for(const [frame,b] of frameBindings){if(frame.contentWindow!==e.source)continue;writeRoute(b.sectionId,b.key,'mock',false,route);if($('mock-dialog').open&&$('open-mock-tab').href)$('open-mock-tab').href=assetTabUrl(b.sectionId,b.key,route);break}return}if(e.data?.type!=='dashboard-feedback'||typeof e.data.html!=='string')return;for(const [frame,b] of frameBindings){if(frame.contentWindow!==e.source)continue;b.asset.html=e.data.html;const current=spec.sections.find(x=>x.id===b.sectionId)?.[b.key];if(current?.sha256===b.asset.sha256)current.html=e.data.html;const id=draftKey(b.sectionId,b.key,b.asset);spec.feedbackDrafts=spec.feedbackDrafts||{};spec.feedbackDrafts[id]={sectionId:b.sectionId,key:b.key,sourceHash:b.asset.sha256,label:b.asset.label,html:e.data.html,revision:b.revision};$('drafts').classList.remove('hidden');$('drafts').textContent='Feedback drafts ('+Object.keys(spec.feedbackDrafts).length+')';break}});
async function flushFrames(){for(const [frame] of frameBindings)if(frame.isConnected&&frame.closest('dialog[open]'))captureFrame(frame);await new Promise(resolve=>setTimeout(resolve,120))}
function mergeDrafts(next){next.feedbackDrafts={...(next.feedbackDrafts||{}),...(spec.feedbackDrafts||{})};for(const section of next.sections)for(const key of ['before','target','current']){const a=section[key];if(a?.kind==='html'){const draft=next.feedbackDrafts[draftKey(section.id,key,a)];if(draft)a.html=draft.html}}return next}
const labels={todo:'Not started',doing:'In progress',blocked:'Blocked',review:'In review',done:'Done'};
function assetPanel(s,key,title,index){

 const canvas=el('div','canvas'),a=s[key];
 if(a?.kind==='image'&&a.data){const img=el('img');img.src=a.data;img.alt=a.label;img.tabIndex=0;img.setAttribute('role','button');const zoom=()=>openImage(a,s.id,key);img.onclick=zoom;img.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();zoom()}};canvas.append(img)}

function render(){
 renderOptions();
 for(const [frame] of frameBindings)if(!frame.isConnected)frameBindings.delete(frame);
 const s=spec.sections.find(x=>x.id===selected)||spec.sections[0];selected=s.id;const idx=spec.sections.indexOf(s),total=spec.sections.length,complete=spec.sections.filter(done).length,percent=Math.floor(100*complete/total);
 document.title=spec.title+' · Progress';$('project').textContent=spec.title;$('overall').replaceChildren(document.createTextNode(percent),el('span','','%'));$('overall-bar').style.width=percent+'%';$('overall-label').textContent=complete+' of '+total+' sections done';

 $('checks-summary').textContent=s.criteria.filter(c=>c.passed).length+'/'+s.criteria.length+' criteria verified · Details';$('judge-summary').textContent=spec.gauntlet?'Judge: '+(s.judge?.verdict||'pending'):'Judge off';$('criteria').replaceChildren(...s.criteria.map(c=>{const row=el('li');row.append(el('span','tick',c.passed?'✓':'○'));const t=el('div','',c.text);t.append(el('small','',c.evidence||'No evidence yet'));row.append(t);return row}));$('judge-detail').replaceChildren();if(s.judge?.evidence){$('judge-detail').append(el('div','judge-row',(s.judge.agentId||'Judge')+' · '+s.judge.evidence))}

}
function updateClock(){const age=Math.max(0,Math.floor((Date.now()-Date.parse(spec.updatedAt))/1000));$('updated').textContent='Updated '+(age<60?age+'s':Math.floor(age/60)+'m')+' ago · v'+spec.revision;$('connection').replaceChildren(el('span','dot'+(!connected?' stale':'')),document.createTextNode(location.protocol==='file:'?'Offline snapshot':connected?'Live connection':'Connection lost'));}
function move(n){const i=spec.sections.findIndex(x=>x.id===selected);if(spec.sections[i+n]){selected=spec.sections[i+n].id;writeRoute(selected,'','');render()}}
$('previous').onclick=()=>move(-1);$('next-section').onclick=()=>move(1);$('present').onclick=()=>document.body.classList.add('present');$('exit-present').onclick=()=>document.body.classList.remove('present');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const dialog=document.querySelector('dialog[open]');if(dialog){e.preventDefault();closeDialog(dialog);return}document.body.classList.remove('present');return}if(e.target.matches('input,select,textarea')||document.querySelector('dialog[open]'))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
function renderOptions(){
 const refs={none:'No references · AI draft',names:'Platform names',images:'Supplied screenshots'};
 $('options-status').textContent=spec.optionsConfirmedAt?'Selected at the start of this run. Read-only.':'Awaiting run options in chat.';
 const values=[['Execution',spec.engine==='ralph'?'Ralph loop':'Existing workflow'],['Execution skill',spec.engine==='ralph'?'/sk:work-ralph-loop':'/sk:work-full-detailed-workflow'],['Independent judge',spec.gauntlet?'Gauntlet loop':'Off'],['Reference input',refs[spec.referenceMode]],['Platforms',spec.inspiration||'None'],['Iteration budget',String(spec.maxIterations)],['Selected',spec.optionsConfirmedAt?new Date(spec.optionsConfirmedAt).toLocaleString():'Pending']];

}
 $('setup').onclick=()=>{writeRoute(selected,'','run');renderOptions();$('run-dialog').showModal()};$('close-run').onclick=()=>closeDialog($('run-dialog'));$('close-image').onclick=()=>closeDialog($('image-dialog'));
$('close-mock').onclick=()=>closeDialog($('mock-dialog'));$('mock-dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog($('mock-dialog'))});$('run-dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog($('run-dialog'))});$('image-dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog($('image-dialog'))});$('draft-dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog($('draft-dialog'))});$('drafts').onclick=()=>{writeRoute(selected,'','drafts');$('draft-list').replaceChildren(...Object.values(spec.feedbackDrafts||{}).map(d=>{const b=el('button','',d.label+' · v'+d.revision);b.onclick=()=>{$('draft-dialog').close();openMock({label:d.label,kind:'html',html:d.html,sha256:d.sourceHash},d.sectionId,d.key)};return b}));$('draft-dialog').showModal()};$('close-drafts').onclick=()=>closeDialog($('draft-dialog'));
$('download').onclick=async()=>{await flushFrames();const clone=document.documentElement.cloneNode(true);clone.querySelector('#spec').textContent=JSON.stringify(spec).replace(/</g,'\\u003c').replace(/&/g,'\\u0026');clone.querySelectorAll('dialog').forEach(d=>d.removeAttribute('open'));clone.querySelector('body').classList.remove('present');clone.querySelector('#large-image').removeAttribute('src');const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html'})),a=el('a');a.href=url;a.download='task-dashboard.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
async function applyRoute(){const dialog=document.querySelector('dialog[open]');if(dialog){await flushFrames();if(dialog.open)dialog.close()}const r=readRoute();if(spec.sections.some(s=>s.id===r.section))selected=r.section;render();setTimeout(openRoutedModal,0)}
async function applyRemote(next){const route=readRoute();const dialog=document.querySelector('dialog[open]');if(dialog)await flushFrames();if(dialog&&dialog.open)dialog.close();spec=mergeDrafts(next);lastRevision=spec.revision;render();if(route.modal)setTimeout(openRoutedModal,0);$('announcement').textContent='Progress updated to revision '+spec.revision}
async function poll(){if(location.protocol==='file:')return;try{const r=await fetch('/state',{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error('Plan unavailable');const next=await r.json();connected=true;failed=false;$('error').classList.add('hidden');if(next.revision!==lastRevision)await applyRemote(next)}catch{connected=false;failed=true;$('error').textContent='Live update unavailable. Showing the last valid revision.';$('error').classList.remove('hidden')}finally{updateClock();setTimeout(poll,2000)}}
spec=mergeDrafts(spec);render();setTimeout(openRoutedModal,0);addEventListener('hashchange',applyRoute);setInterval(updateClock,1000);poll();
